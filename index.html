<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Neon Pong — classic pong against a tuned AI with neon visuals, 3 difficulties and fireball combos. Free HTML5 game.">
<title>Neon Pong — Free HTML5 Arcade Game</title>
<script>
// 平台 SDK 按域名条件加载（独立运行时完全不加载，游戏行为不变）
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#07070f; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:8px 14px 6px; color:#e8e8f2; }
  #hud .stat { text-align:left; }
  #hud .stat .label { font-size:10px; color:#8a8aa8; letter-spacing:1px; }
  #hud .stat .val { font-size:16px; font-weight:800; color:#4de3ff; }
  #title { font-size:15px; font-weight:800; letter-spacing:3px; color:#ff5edb; text-shadow:0 0 12px rgba(255,94,219,.6); }
  #sound { background:#14142a; color:#9a9ac0; border:1px solid #30305a; border-radius:10px; padding:7px 12px; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  #sound:active { transform:scale(.96); }
  canvas { display:block; border-radius:14px; touch-action:none; width:auto; height:auto; max-width:min(480px,96vw); max-height:calc(100vh - 92px); background:#07070f; }
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,5,12,.78); z-index:5; }
  #panel { background:#14142a; border:1px solid #30305a; border-radius:18px; padding:26px 34px; text-align:center; color:#fff; max-width:86%; box-shadow:0 0 40px rgba(90,60,255,.25); }
  #panel h2 { font-size:24px; letter-spacing:2px; margin-bottom:8px; color:#fff; text-shadow:0 0 14px rgba(77,227,255,.55); }
  #panel p { color:#9a9ac0; font-size:13px; margin-bottom:12px; line-height:1.5; }
  #panel .rec { color:#e8e8f2; font-weight:700; font-size:13px; }
  #panel .final { font-size:34px; font-weight:900; color:#ffd76a; margin:2px 0 14px; }
  .btnRow { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .diffBtn { border:none; border-radius:12px; padding:12px 18px; font-size:14px; font-weight:800; letter-spacing:1px; color:#fff; cursor:pointer; min-width:104px; }
  .diffBtn:active { transform:scale(.96); }
  #btnEasy { background:linear-gradient(135deg,#00b8a9,#0fa3ff); }
  #btnNormal { background:linear-gradient(135deg,#5b6cff,#8a5bff); }
  #btnHard { background:linear-gradient(135deg,#ff2f6d,#ff7b3d); }
  #againBtn { background:linear-gradient(135deg,#ff2fd6,#7b5bff); color:#fff; border:none; border-radius:12px; padding:12px 34px; font-size:16px; font-weight:800; cursor:pointer; margin-top:6px; }
  #againBtn:active { transform:scale(.97); }
  #footer { color:#55556e; font-size:11px; padding:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><div class="label">RECORD</div><div class="val" id="record">0W · 0L</div></div>
    <div id="title">NEON PONG</div>
    <button id="sound">SOUND ON</button>
  </div>
  <div style="position:relative">
    <canvas id="game"></canvas>
    <div id="overlay"><div id="panel">
      <div id="menuBox">
        <h2>NEON PONG</h2>
        <p>First to 7 points wins.<br>5 straight paddle hits without touching a wall = FIREBALL.</p>
        <p class="rec" id="menuRecord">Record: 0W · 0L</p>
        <div class="btnRow">
          <button class="diffBtn" id="btnEasy">EASY</button>
          <button class="diffBtn" id="btnNormal">NORMAL</button>
          <button class="diffBtn" id="btnHard">HARD</button>
        </div>
      </div>
      <div id="endBox" style="display:none">
        <h2 id="endTitle">YOU WIN</h2>
        <p class="final" id="endScore">7 — 0</p>
        <p class="rec" id="endRecord">Record: 0W · 0L</p>
        <button id="againBtn">PLAY AGAIN</button>
      </div>
    </div></div>
  </div>
  <div id="footer">Neon Pong — a free arcade game</div>
</div>
<script>
"use strict";
// ================= 常量 =================
var W = 480, H = 700;               // 逻辑分辨率（CSS 自适应缩放）
var PW = 92, PH = 12, R = 8;        // 球拍宽/高、球半径
var PLAYER_Y = H - 42;              // 玩家球拍（底部）顶面 y
var AI_Y = 30;                      // AI 球拍（顶部）顶面 y，底面 = AI_Y + PH
var BASE_SPEED = 330;               // 每分发球初速
var MAX_SPEED = 640;                // 常规回合速度上限
var FIRE_SPEED = 700;               // 火球模式速度硬上限（防无限加速）
var WIN_SCORE = 7;                  // 先得 7 分胜
var COMBO_GOAL = 5;                 // 不碰墙连续对拍次数 → 火球
var MAX_ANGLE = 58 * Math.PI / 180; // 拍边最大出射角（保证竖直分量，不会水平死循环）
var KEY_SPEED = 540;                // 键盘移动速度 px/s

// AI 三档难度：反应延迟 / 最大移速 / 预测误差
// 另有全局公平性设计：球速越快 AI 误差被放大（见 aiErr），高难度也不会“永远接得住”
var DIFFS = {
  easy:   { label: "EASY",   delay: 0.30, speed: 235, err: 62 },
  normal: { label: "NORMAL", delay: 0.16, speed: 345, err: 30 },
  hard:   { label: "HARD",   delay: 0.07, speed: 430, err: 18 }
};

// ================= 画布自适应 =================
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

// ================= 状态 =================
var state = "MENU";                 // MENU | PLAY | END
var diffKey = "normal", lastDiff = "normal";
var DIFF = DIFFS.normal;
var you = 0, cpu = 0;               // 本局比分（玩家 / AI）
var wins = 0, losses = 0;           // 历史战绩（localStorage）
var muted = false;
var player = { x: (W - PW) / 2, flash: 0 };
var ai = { x: (W - PW) / 2, flash: 0, planned: false, timer: 0, err: 0 };
var ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: BASE_SPEED, prevY: H / 2 };
var serveTimer = 0, serveDir = 1;   // serveDir: 1=发向玩家(下)  -1=发向AI(上)
var combo = 0, fire = false, fireFlash = 0;
var trail = [], particles = [], floats = [];
var keys = { left: false, right: false };
var shake = 0, clock = 0;
var gameplayStarted = false;        // SDK gameplayStart 是否已触发

function loadRecord() {
  try {
    wins = parseInt(localStorage.getItem("np_wins") || "0", 10) || 0;
    losses = parseInt(localStorage.getItem("np_losses") || "0", 10) || 0;
    muted = localStorage.getItem("np_muted") === "1";
  } catch (e) {}
}
function saveRecord() {
  try {
    localStorage.setItem("np_wins", String(wins));
    localStorage.setItem("np_losses", String(losses));
  } catch (e) {}
}
function saveMuted() { try { localStorage.setItem("np_muted", muted ? "1" : "0"); } catch (e) {} }

// ================= 音效（WebAudio 程序化合成，击拍/墙壁/得分音高不同） =================
var actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function beep(freq, dur, type, gainv, delay) {
  try {
    if (muted) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(gainv || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function sfxWall()      { beep(300, 0.045, "sine", 0.06); }                 // 墙壁：低
function sfxPaddle(mine){ beep(mine ? 520 : 430, 0.055, "triangle", 0.09); } // 击拍：中
function sfxScoreYou()  { beep(660, 0.09, "square", 0.07); beep(880, 0.14, "square", 0.07, 0.09); }
function sfxScoreCpu()  { beep(196, 0.16, "sawtooth", 0.08); beep(131, 0.22, "sawtooth", 0.08, 0.12); }
function sfxFire()      { beep(700, 0.08, "square", 0.07); beep(950, 0.1, "square", 0.07, 0.08); beep(1200, 0.12, "square", 0.06, 0.16); }
function sfxWin()       { beep(523, 0.12, "triangle", 0.09); beep(659, 0.12, "triangle", 0.09, 0.12); beep(784, 0.12, "triangle", 0.09, 0.24); beep(1047, 0.25, "triangle", 0.1, 0.36); }
function sfxLose()      { beep(392, 0.15, "sawtooth", 0.07); beep(311, 0.15, "sawtooth", 0.07, 0.15); beep(233, 0.3, "sawtooth", 0.07, 0.3); }

// ================= 特效 =================
function burst(x, y, color, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = (spd || 120) * (0.4 + Math.random() * 0.9);
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45 + Math.random() * 0.25, life0: 0.7, color: color, size: 2 + Math.random() * 2.5 });
  }
}
function floatText(x, y, text, color, big) { floats.push({ x: x, y: y, text: text, color: color || "#fff", big: !!big, life: 0.9 }); }

function updateFX(dt) {
  clock += dt;
  if (player.flash > 0) player.flash = Math.max(0, player.flash - dt * 4);
  if (ai.flash > 0) ai.flash = Math.max(0, ai.flash - dt * 4);
  if (fireFlash > 0) fireFlash = Math.max(0, fireFlash - dt * 1.5);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
  if (state === "PLAY" && serveTimer <= 0) {
    // 球拖尾
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 16) trail.shift();
    // 火球火星
    if (fire && Math.random() < 0.5) {
      particles.push({ x: ball.x + (Math.random() * 2 - 1) * 6, y: ball.y + (Math.random() * 2 - 1) * 6, vx: (Math.random() * 2 - 1) * 40, vy: (Math.random() * 2 - 1) * 40 - 30, life: 0.35, life0: 0.35, color: Math.random() < 0.5 ? "#ff9f43" : "#ff5e5e", size: 2 + Math.random() * 2 });
    }
  } else if (trail.length > 0) trail.splice(0, 2);
  for (var i = particles.length - 1; i >= 0; i--) {
    var pt = particles[i];
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
  }
  for (var j = floats.length - 1; j >= 0; j--) {
    var fl = floats[j];
    fl.life -= dt; fl.y -= 34 * dt;
    if (fl.life <= 0) floats.splice(j, 1);
  }
}

// ================= AI =================
// 高阶公平性：球速超过 430 后，预测误差随球速快速放大（球快了谁都会失误，
// 同时保证高难度也不会出现“永远接得住”的死循环长回合）
function aiErr() {
  var over = Math.max(0, ball.speed - 430) / 270;
  return DIFF.err * (1 + over * 4);
}
// 预测球到达 targetY 时的 x（含侧墙镜面反射折叠）
function predictX(targetY) {
  if (ball.vy >= 0) return ball.x;
  var t = (targetY - ball.y) / ball.vy;
  if (!(t > 0)) return ball.x;
  if (t > 8) t = 8;
  var px = ball.x + ball.vx * t;
  var span = W - 2 * R;
  px = (px - R) % (2 * span);
  if (px < 0) px += 2 * span;
  if (px > span) px = 2 * span - px;
  return px + R;
}
function movePaddleToward(p, targetX, maxStep) {
  var d = targetX - p.x;
  if (Math.abs(d) <= maxStep) p.x = targetX;
  else p.x += (d > 0 ? maxStep : -maxStep);
  p.x = Math.max(0, Math.min(W - PW, p.x));
}
function updateAI(dt) {
  var faceY = AI_Y + PH;
  var approaching = ball.vy < 0 && ball.y > faceY;
  if (approaching) {
    if (!ai.planned) {
      // 球刚转向朝上（玩家击出）：掷一次反应延迟 + 一次预测误差
      ai.planned = true;
      ai.timer = DIFF.delay;
      ai.err = (Math.random() * 2 - 1) * aiErr();
    }
    if (ai.timer > 0) { ai.timer -= dt; return; } // 反应延迟期间原地不动
    movePaddleToward(ai, predictX(faceY + R) + ai.err - PW / 2, DIFF.speed * dt);
  } else {
    ai.planned = false;
    movePaddleToward(ai, (W - PW) / 2, DIFF.speed * 0.45 * dt); // 回中待命
  }
}

// ================= 核心物理 =================
function clampPlayer() { player.x = Math.max(0, Math.min(W - PW, player.x)); }

function onWall() {
  sfxWall();
  burst(ball.x, ball.y, "#7c8cff", 6, 90);
  if (!fire) combo = 0; // 火球期间碰墙不熄火
}

function hitPaddle(p, dir) {
  var cx = p.x + PW / 2;
  var hit = Math.max(-1, Math.min(1, (ball.x - cx) / (PW / 2))); // 拍心 0，拍边 ±1
  var ang = hit * MAX_ANGLE + (Math.random() * 2 - 1) * 0.035;   // ±2° 抖动，防死循环
  ang = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, ang));
  combo++;
  var cap = fire ? FIRE_SPEED : MAX_SPEED;
  ball.speed = Math.min(ball.speed * 1.045 + 6, cap); // 球速渐快，有上限
  if (!fire && combo >= COMBO_GOAL) {
    // 彩蛋：连击触发火球
    fire = true; fireFlash = 1;
    ball.speed = Math.min(ball.speed * 1.18, FIRE_SPEED);
    sfxFire();
    floatText(W / 2, H / 2 + 70, "FIREBALL!", "#ff9f43", true);
    burst(ball.x, ball.y, "#ff9f43", 20, 180);
  }
  ball.vx = Math.sin(ang) * ball.speed;
  ball.vy = dir * Math.cos(ang) * ball.speed;
  p.flash = 1;
  var isMine = (p === player);
  sfxPaddle(isMine);
  burst(ball.x, isMine ? PLAYER_Y : AI_Y + PH, fire ? "#ff9f43" : (isMine ? "#4de3ff" : "#ff5edb"), 10, 130);
}

function stepBall(dt) {
  ball.prevY = ball.y;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  // 侧墙
  if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); onWall(); }
  else if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); onWall(); }
  // 玩家拍面（底部，仅球下行时）
  if (ball.vy > 0 && ball.x > player.x - R && ball.x < player.x + PW + R &&
      ball.y + R >= PLAYER_Y && ball.y - R <= PLAYER_Y + PH + 12) {
    ball.y = PLAYER_Y - R;
    hitPaddle(player, -1);
  }
  // AI 拍面（顶部，仅球上行时）
  else if (ball.vy < 0 && ball.x > ai.x - R && ball.x < ai.x + PW + R &&
      ball.y - R <= AI_Y + PH && ball.y + R >= AI_Y - 12) {
    ball.y = AI_Y + PH + R;
    hitPaddle(ai, 1);
  }
  // 上下越界 = 得分（球落底部=玩家漏接→AI得分；球飞顶部=AI漏接→玩家得分）
  if (ball.y > H + 26) scorePoint(false);
  else if (ball.y < -26) scorePoint(true);
}

// ================= 比赛流程 =================
function serveTowards(receiver) {
  ball.x = W / 2; ball.y = H / 2; ball.prevY = H / 2;
  ball.vx = 0; ball.vy = 0; ball.speed = BASE_SPEED;
  serveDir = receiver === "you" ? 1 : -1; // 发向刚丢分的一方（输家先接）
  serveTimer = 0.9;
  ai.planned = false; ai.timer = 0;
  trail.length = 0;
}
function launch() {
  var a = (Math.random() * 2 - 1) * (Math.PI / 6); // ±30° 随机发球角
  ball.vx = Math.sin(a) * BASE_SPEED;
  ball.vy = serveDir * Math.cos(a) * BASE_SPEED;
}
function scorePoint(youScored) {
  if (youScored) { you++; sfxScoreYou(); floatText(W / 2, 150, "+1 YOU", "#4de3ff", true); }
  else { cpu++; sfxScoreCpu(); floatText(W / 2, 560, "+1 CPU", "#ff5edb", true); }
  burst(Math.max(20, Math.min(W - 20, ball.x)), youScored ? 6 : H - 6, youScored ? "#4de3ff" : "#ff5edb", 26, 220);
  shake = 1;
  combo = 0; fire = false; trail.length = 0;
  if (you >= WIN_SCORE || cpu >= WIN_SCORE) endMatch(you >= WIN_SCORE);
  else serveTowards(youScored ? "ai" : "you"); // 发给刚丢分的一方接
}
function startMatch(key) {
  if (!DIFFS[key]) key = "normal";
  diffKey = key; DIFF = DIFFS[key]; lastDiff = key;
  you = 0; cpu = 0; combo = 0; fire = false; fireFlash = 0; shake = 0;
  particles.length = 0; floats.length = 0; trail.length = 0;
  player.x = (W - PW) / 2; player.flash = 0;
  ai.x = (W - PW) / 2; ai.flash = 0;
  document.getElementById("overlay").style.display = "none";
  state = "PLAY";
  serveTowards("you");
  // 平台埋点：一局开始（SDK 已域名守卫）
  if (!gameplayStarted) {
    gameplayStarted = true;
    try {
      if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
        window.CrazyGames.SDK.game.gameplayStart();
      }
    } catch (e) {}
  }
}
function endMatch(win) {
  state = "END";
  if (win) wins++; else losses++;
  saveRecord(); updateRecordUI();
  var et = document.getElementById("endTitle");
  et.textContent = win ? "YOU WIN" : "AI WINS";
  et.style.color = win ? "#4de3ff" : "#ff5edb";
  et.style.textShadow = "0 0 16px " + (win ? "rgba(77,227,255,.6)" : "rgba(255,94,219,.6)");
  document.getElementById("endScore").textContent = you + " — " + cpu;
  document.getElementById("menuBox").style.display = "none";
  document.getElementById("endBox").style.display = "block";
  document.getElementById("overlay").style.display = "flex";
  if (win) sfxWin(); else sfxLose();
  // 平台埋点：一局结束
  if (gameplayStarted) {
    gameplayStarted = false;
    try {
      if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
        window.CrazyGames.SDK.game.gameplayStop();
        if (win) window.CrazyGames.SDK.game.happytime();
      }
    } catch (e) {}
  }
}
function showMenu() {
  state = "MENU";
  document.getElementById("menuBox").style.display = "block";
  document.getElementById("endBox").style.display = "none";
  document.getElementById("overlay").style.display = "flex";
  updateRecordUI();
}

function update(dt) {
  // 玩家键盘移动
  if (keys.left) player.x -= KEY_SPEED * dt;
  if (keys.right) player.x += KEY_SPEED * dt;
  clampPlayer();
  updateAI(dt);
  if (serveTimer > 0) {
    serveTimer -= dt;
    if (serveTimer <= 0) launch();
  } else {
    stepBall(dt);
  }
  updateFX(dt);
}

// ================= 渲染 =================
function roundRect(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}
function drawPaddle(p, y, color) {
  ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  roundRect(ctx, p.x, y, PW, PH, 6); ctx.fill();
  if (p.flash > 0) { // 击拍闪光
    ctx.globalAlpha = p.flash * 0.9;
    ctx.fillStyle = "#fff";
    roundRect(ctx, p.x, y, PW, PH, 6); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake * 7, (Math.random() * 2 - 1) * shake * 7);
  // 背景
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0c0c1e"); bg.addColorStop(1, "#07070f");
  ctx.fillStyle = bg; ctx.fillRect(-12, -12, W + 24, H + 24);
  // 中线（虚线）
  ctx.strokeStyle = "rgba(120,140,255,.28)";
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 14]);
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.setLineDash([]);
  // 经典大号暗色比分
  ctx.font = "900 88px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,94,219,.16)";
  ctx.fillText(String(cpu), W / 2, 210);
  ctx.fillStyle = "rgba(77,227,255,.16)";
  ctx.fillText(String(you), W / 2, 496);
  // 发球间隙信息条
  if (state === "PLAY" && serveTimer > 0) {
    var matchPoint = (you === WIN_SCORE - 1 || cpu === WIN_SCORE - 1);
    ctx.fillStyle = matchPoint ? "rgba(255,215,106,.85)" : "rgba(255,255,255,.4)";
    ctx.font = "700 13px sans-serif";
    ctx.fillText(matchPoint ? "MATCH POINT" : DIFF.label + "  ·  FIRST TO " + WIN_SCORE, W / 2, 280);
  }
  // 火球提示（脉冲）
  if (fire && state === "PLAY") {
    ctx.globalAlpha = 0.5 + 0.35 * Math.sin(clock * 10);
    ctx.fillStyle = "#ff9f43";
    ctx.font = "800 18px sans-serif";
    ctx.fillText("FIREBALL", W / 2, H / 2 + 30);
    ctx.globalAlpha = 1;
  }
  // 连击计数
  if (state === "PLAY" && !fire && combo >= 2 && serveTimer <= 0) {
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.font = "700 12px sans-serif";
    ctx.fillText("COMBO " + combo + " / " + COMBO_GOAL, W / 2, H - 78);
  }
  // 拖尾
  for (var i = 0; i < trail.length; i++) {
    var f = (i + 1) / trail.length;
    ctx.globalAlpha = f * 0.35;
    ctx.fillStyle = fire ? (i % 2 ? "#ff6b3d" : "#ffd166") : "#4de3ff";
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, R * f * 0.9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 粒子
  for (var p = 0; p < particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life / pt.life0);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  // 球拍（AI 上 / 玩家下）
  drawPaddle(ai, AI_Y, "#ff5edb");
  drawPaddle(player, PLAYER_Y, "#4de3ff");
  // 球
  if (state === "PLAY") {
    var serving = serveTimer > 0;
    ctx.globalAlpha = serving ? 0.45 + 0.25 * Math.sin(clock * 8) : 1;
    ctx.shadowColor = fire ? "#ff8c42" : "#ffffff";
    ctx.shadowBlur = fire ? 22 : 14;
    ctx.fillStyle = fire ? "#ffe8d6" : "#ffffff";
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  // 浮字
  for (var j = 0; j < floats.length; j++) {
    var fl = floats[j];
    ctx.globalAlpha = Math.min(1, fl.life / 0.4);
    ctx.fillStyle = fl.color;
    ctx.font = "800 " + (fl.big ? 22 : 15) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

var last = 0;
function frame(t) {
  var dt = Math.min((t - last) / 1000, 0.033); last = t; // dt 上限，防止切后台后穿模
  if (state === "PLAY") update(dt);
  else updateFX(dt);
  render();
  requestAnimationFrame(frame);
}

// ================= 输入（鼠标 / 触控 / 键盘 双端） =================
function paddleFromClientX(clientX) {
  var rect = canvas.getBoundingClientRect();
  var x = (clientX - rect.left) / rect.width * W;
  player.x = Math.max(0, Math.min(W - PW, x - PW / 2));
}
canvas.addEventListener("mousemove", function (e) { if (state === "PLAY") paddleFromClientX(e.clientX); });
canvas.addEventListener("touchstart", function (e) {
  e.preventDefault(); unlockAudio();
  if (state === "PLAY") paddleFromClientX(e.touches[0].clientX);
}, { passive: false });
canvas.addEventListener("touchmove", function (e) {
  e.preventDefault();
  if (state === "PLAY") paddleFromClientX(e.touches[0].clientX);
}, { passive: false });
document.getElementById("btnEasy").addEventListener("click", function () { unlockAudio(); startMatch("easy"); });
document.getElementById("btnNormal").addEventListener("click", function () { unlockAudio(); startMatch("normal"); });
document.getElementById("btnHard").addEventListener("click", function () { unlockAudio(); startMatch("hard"); });
document.getElementById("againBtn").addEventListener("click", function () { showMenu(); });
document.getElementById("sound").addEventListener("click", function () { unlockAudio(); toggleMute(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") { keys.left = true; e.preventDefault(); }
  else if (e.key === "ArrowRight") { keys.right = true; e.preventDefault(); }
  else if (e.key === "m" || e.key === "M") toggleMute();
  else if (e.key === " " || e.key === "Enter") {
    e.preventDefault(); unlockAudio();
    if (state === "MENU") startMatch(lastDiff);
    else if (state === "END") showMenu();
  }
});
document.addEventListener("keyup", function (e) {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});

// ================= UI =================
function toggleMute() {
  muted = !muted; saveMuted(); applyMuteUI();
  if (!muted) beep(660, 0.06, "sine", 0.06);
}
function applyMuteUI() { document.getElementById("sound").textContent = muted ? "SOUND OFF" : "SOUND ON"; }
function updateRecordUI() {
  var t = wins + "W · " + losses + "L";
  document.getElementById("record").textContent = t;
  document.getElementById("menuRecord").textContent = "Record: " + t;
  document.getElementById("endRecord").textContent = "Record: " + t;
}
function syncHud() {
  // HUD/页脚宽度跟随 canvas 实际渲染宽度（小屏时 canvas 变窄）
  try { var w = canvas.getBoundingClientRect().width; document.getElementById("hud").style.width = w + "px"; } catch (e) {}
}
try { if (typeof window.addEventListener === "function") window.addEventListener("resize", syncHud); } catch (e) {}

// ================= 启动 =================
loadRecord();
applyMuteUI();
updateRecordUI();
syncHud();
showMenu();
requestAnimationFrame(frame);

// 调试/模拟钩子（不影响游戏逻辑，供自动化测试使用）
window.__np = {
  get state() { return state; },
  get you() { return you; },
  get cpu() { return cpu; },
  get combo() { return combo; },
  get fire() { return fire; },
  get ballSpeed() { return ball.speed; },
  get serveTimer() { return serveTimer; },
  get serveDir() { return serveDir; },
  get ball() { return ball; },
  get playerX() { return player.x; },
  get aiX() { return ai.x; },
  get PW() { return PW; },
  start: startMatch,
  step: function (dt) { if (state === "PLAY") update(dt); return state; },
  setPlayerX: function (x) { player.x = Math.max(0, Math.min(W - PW, x)); }
};
</script>
